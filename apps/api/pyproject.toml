[project]
name = "hibi-api"
version = "0.1.0"
description = "Hibi business API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cryptography==46.0.3",
  "fastapi>=0.119,<1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.37,<1",
  "asyncpg>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "arq>=0.26,<1",
  "typesafe-sdk>=0.7,<1",
  "structlog>=26.1.0",
  "openai>=3.42.1",
  "numpy>=2.5.4",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
  "ty>=0.0.1a20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hibi"]

[tool.pytest.ini_options]
markers = [
  "integration: requires Supabase local at HIBI_SUPABASE_URL",
]
addopts = "-q -m 'not integration'"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ty.environment]
python-version = "3.14"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
